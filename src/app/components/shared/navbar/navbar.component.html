<style>
  nav{
    display: flex;
    justify-content: space-around;
    background-color: #212121;
    color: white;
    padding: 10px;
  }

  nav a{
    color: white;
    text-decoration: none;
  }

  nav a.active{
    color: red;
    text-decoration: underline;
  }

</style>
<nav>
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Contador</a>
  <!-- Esta otra forma es por si uno quiere mandar segmentos de url en la ruta -->
  <a [routerLink]="['/hero']"  routerLinkActive="active">Hero</a>
  <a [routerLink]="['/dragonball']" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Dragonball</a>
</nav>
